services:
  # ===========================================================================
  # LAYER 1: PERSISTENT VECTOR MEMORY (Qdrant + HuggingFace TEI)
  # Profile: memory
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: xenonite-qdrant
    profiles: ["memory"]
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - xenonite_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: xenonite-tei
    profiles: ["memory"]
    restart: unless-stopped
    ports:
      - "8080:80"
    command:
      - "--model-id"
      - "${TEI_MODEL_ID:-BAAI/bge-m3}"
      - "--port"
      - "80"
    volumes:
      - xenonite_tei_cache:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:80/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

  # ===========================================================================
  # LAYER 2: SOVEREIGN WEB INTELLIGENCE (SearXNG + Crawl4AI)
  # Profile: intel
  # ===========================================================================
  searxng:
    image: searxng/searxng:latest
    container_name: xenonite-searxng
    profiles: ["intel"]
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:-xenonite-change-this-secret-key}
    volumes:
      - ./searxng:/etc/searxng:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: xenonite-crawl4ai
    profiles: ["intel"]
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "11235:11235"
    environment:
      - CRAWL4AI_API_TOKEN=${XENONITE_CRAWL4AI_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:11235/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  xenonite_qdrant_data:
  xenonite_tei_cache:
